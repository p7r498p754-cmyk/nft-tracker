name: monitor
# Free hosting: GitHub Actions on a PUBLIC repository (standard runners are free there).
# GitHub schedules are best-effort: runs can be delayed and are NOT real-time.
on:
  push:
    branches: [main]
    paths:
      - 'nft_tracker/**'
      - '.github/workflows/monitor.yml'
  schedule:
    - cron: "4-59/5 * * * *"     # about every 5 minutes (off the congested :00 slot)
  workflow_dispatch:
    inputs:
      check_delivery:
        description: Send a single delivery check to the owner before scanning
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nft-tracker-monitor
  cancel-in-progress: false

jobs:
  scan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore state (dedup, sales history, settings)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: nft-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nft-state-
      - name: Verify owner delivery
        if: github.event_name == 'workflow_dispatch' && inputs.check_delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          python - <<'PYTHON'
          import os
          from nft_tracker.telegram import TelegramClient
          client = TelegramClient(os.environ["TELEGRAM_BOT_TOKEN"])
          owner = int(os.environ["OWNER_CHAT_ID"])
          if client.call("getMe").get("username", "").lower() != "nfttrecker_bot":
              raise SystemExit("Unexpected bot identity")
          msg = client.send(owner, "Проверка связи NFT Tracker. Это служебное сообщение. Для подписки на сигналы отправьте /start.")
          if msg.get("chat", {}).get("id") != owner or not msg.get("message_id"):
              raise SystemExit("Owner delivery unconfirmed")
          print("Telegram accepted the owner message")
          PYTHON
      - name: Listen for Telegram commands while monitoring is disabled
        if: github.event_name != 'workflow_dispatch' && vars.MONITOR_ENABLED != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: python -m nft_tracker commands
      - name: Run one monitoring cycle
        if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == '1'
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PORTALS_API_KEY: ${{ secrets.PORTALS_API_KEY }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          PORTALS_LISTING_URL_TEMPLATE: ${{ vars.PORTALS_LISTING_URL_TEMPLATE }}
          PORTALS_PURCHASE_ACTION: ${{ vars.PORTALS_PURCHASE_ACTION }}
          PRICE_UNIT: ${{ vars.PRICE_UNIT }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          LISTING_PAGES: ${{ vars.LISTING_PAGES }}
          ALLOW_NO_LINK_ALERTS: ${{ vars.ALLOW_NO_LINK_ALERTS }}
        run: python -m nft_tracker serve-once
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: nft-state-${{ github.run_id }}-${{ github.run_attempt }}
